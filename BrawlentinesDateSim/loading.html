<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawlentine's Date Simulator - Loading</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 96, 138, 0.35), transparent 28%),
                radial-gradient(circle at 78% 72%, rgba(255, 207, 74, 0.28), transparent 26%),
                linear-gradient(135deg, #25143d 0%, #3d1743 48%, #181d3b 100%);
            color: #fff8fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .loading-screen {
            width: min(92vw, 480px);
            padding: 34px 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(20, 12, 35, 0.78);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
            text-align: center;
        }

        .badge {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 12px;
            border-radius: 999px;
            background: #ff477e;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 7vw, 3.6rem);
            line-height: 0.95;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #f7d8e4;
            font-size: 1rem;
        }

        .bar {
            height: 18px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.28);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ff477e, #ffd34f);
            box-shadow: 0 0 18px rgba(255, 71, 126, 0.72);
            transition: width 0.18s ease;
        }

        .loading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-top: 14px;
            color: #ffe9f1;
            font-size: 0.92rem;
        }

        .status {
            min-width: 0;
            text-align: left;
        }

        .percent {
            width: 44px;
            font-weight: 700;
            text-align: right;
        }
    </style>
</head>
<body>
    <main class="loading-screen" aria-live="polite">
        <span class="badge">Loading</span>
        <h1>Brawlentine's<br>Date Simulator</h1>
        <p class="subtitle">Getting the date night chaos ready...</p>

        <div class="bar" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="bar-fill"></div>
        </div>

        <div class="loading-row">
            <span class="status">Preparing menu</span>
            <span class="percent">0%</span>
        </div>
    </main>

    <script>
        const progressBar = document.querySelector(".bar");
        const fill = document.querySelector(".bar-fill");
        const percent = document.querySelector(".percent");
        const statusText = document.querySelector(".status");

        const statusMessages = [
            "Preparing menu",
            "Checking bouquet physics",
            "Charging dramatic dialogue",
            "Setting up the first choice",
            "Ready"
        ];

        let progress = 0;
        const timer = window.setInterval(() => {
            progress = Math.min(progress + Math.floor(Math.random() * 9) + 4, 100);
            const messageIndex = Math.min(
                Math.floor(progress / 25),
                statusMessages.length - 1
            );

            fill.style.width = `${progress}%`;
            percent.textContent = `${progress}%`;
            statusText.textContent = statusMessages[messageIndex];
            progressBar.setAttribute("aria-valuenow", progress);

            if (progress >= 100) {
                window.clearInterval(timer);
                window.setTimeout(() => {
                    window.location.href = "index.html";
                }, 550);
            }
        }, 220);
    </script>
</body>
</html>
